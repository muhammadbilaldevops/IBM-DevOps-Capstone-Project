apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: accounts-cd
spec:
  params:
    - name: repository
      type: string
      description: Git repository containing the Accounts service.
    - name: revision
      type: string
      default: main
    - name: image
      type: string
      default: accounts:latest
  workspaces:
    - name: source

  tasks:
    - name: fetch-source
      taskSpec:
        params:
          - name: repository
            type: string
          - name: revision
            type: string
        workspaces:
          - name: source
        steps:
          - name: clone
            image: alpine/git:2.45.2
            workingDir: $(workspaces.source.path)
            script: |
              rm -rf ./*
              git clone --depth 1 --branch $(params.revision) $(params.repository) .
      params:
        - name: repository
          value: $(params.repository)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: source
          workspace: source

    - name: test
      runAfter: [fetch-source]
      taskSpec:
        workspaces:
          - name: source
        steps:
          - name: test
            image: python:3.11-slim
            workingDir: $(workspaces.source.path)
            script: |
              python -m pip install --no-cache-dir -r requirements.txt
              flake8 service tests
              nosetests -v
      workspaces:
        - name: source
          workspace: source

    - name: deploy
      runAfter: [test]
      taskSpec:
        params:
          - name: image
            type: string
        workspaces:
          - name: source
        steps:
          - name: apply
            image: bitnami/kubectl:latest
            workingDir: $(workspaces.source.path)
            script: |
              sed "s#accounts:latest#$(params.image)#g" kubernetes/deployment.yaml | kubectl apply -f -
              kubectl apply -f kubernetes/service.yaml
      params:
        - name: image
          value: $(params.image)
      workspaces:
        - name: source
          workspace: source
