---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: cd-pipeline
spec:
  description: Clone, lint, test, build and deploy the Accounts service.
  workspaces:
    - name: pipeline-workspace
  params:
    - name: repo-url
      type: string
      description: Public Git repository URL.
    - name: revision
      type: string
      default: main
    - name: build-image
      type: string
      description: Full registry image reference to build and push.
      default: accounts:latest
  tasks:
    - name: clone
      taskRef:
        name: git-clone
        kind: ClusterTask
      workspaces:
        - name: output
          workspace: pipeline-workspace
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
        - name: deleteExisting
          value: "true"

    - name: lint
      runAfter: [clone]
      taskRef:
        name: flake8
        kind: ClusterTask
      workspaces:
        - name: source
          workspace: pipeline-workspace
      params:
        - name: image
          value: python:3.11-slim
        - name: args
          value: ["service", "tests", "--count", "--statistics"]

    - name: tests
      runAfter: [clone]
      taskRef:
        name: nose
        kind: ClusterTask
      workspaces:
        - name: source
          workspace: pipeline-workspace
      params:
        - name: args
          value: "-v"

    - name: build-image
      runAfter: [lint, tests]
      taskRef:
        name: buildah
        kind: ClusterTask
      workspaces:
        - name: source
          workspace: pipeline-workspace
      params:
        - name: IMAGE
          value: $(params.build-image)
        - name: TLSVERIFY
          value: "true"
        - name: DOCKERFILE
          value: ./Dockerfile
        - name: CONTEXT
          value: .

    - name: deploy
      runAfter: [build-image]
      taskRef:
        name: accounts-deploy
      workspaces:
        - name: source
          workspace: pipeline-workspace
      params:
        - name: image
          value: $(params.build-image)
