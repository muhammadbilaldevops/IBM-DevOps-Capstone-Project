[nosetests]
verbosity=2
with-coverage=1
cover-erase=1
cover-package=service
cover-tests=1

[coverage:run]
branch = True
source = service

[coverage:report]
omit =
    tests/*
show_missing = True
fail_under = 95

[flake8]
max-line-length = 127
exclude = .git,__pycache__,.venv,venv,build,dist

[pylint]
disable = C0114,C0116,R0903
max-line-length = 127
