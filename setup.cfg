[nosetests]
verbosity=2
with-coverage=1
cover-package=service
cover-tests=1
cover-inclusive=1

[coverage:run]
branch = True
source = service

[coverage:report]
omit =
    tests/*
    service/__init__.py
show_missing = True
fail_under = 80

[flake8]
max-line-length = 100
exclude = .git,__pycache__,.venv,venv,build,dist

[pylint]
disable = C0114,C0116,R0903
max-line-length = 100
